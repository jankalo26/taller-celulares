<div class="card h-100 shadow-sm">
  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <h5 class="card-title h6 mb-0">{{ servicio().nombre }}</h5>
      <span class="badge bg-secondary">{{ servicio().categoria }}</span>
    </div>

    <p class="card-text text-muted small flex-grow-1">{{ servicio().descripcion }}</p>

    <p class="fw-bold mb-1">{{ servicio().precio | currency: 'BOB' : 'Bs. ' : '1.0-0' }}</p>
    <p class="small mb-3" [ngClass]="servicio().repuestos > 0 ? 'text-success' : 'text-danger'">
      Repuestos disponibles: {{ servicio().repuestos }}
    </p>

    <button
      class="btn btn-primary"
      [disabled]="servicio().repuestos === 0"
      (click)="solicitar.emit(servicio())"
    >
      Solicitar
    </button>
  </div>
</div>
